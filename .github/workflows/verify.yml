name: Drift-Sense++ Verification & Compliance CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Verify Reproducibility & Schema Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r FINAL_SUBMISSION/requirements.txt

      - name: Run Judge Quick-Verification Suite (7 Stages)
        run: |
          python FINAL_SUBMISSION/verification/run_all.py

      - name: Run Unit Tests & Invariant Checks
        run: |
          python -m unittest tests/test_suite.py
